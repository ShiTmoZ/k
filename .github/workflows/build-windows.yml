name: Build Windows Desktop App (Tauri v2 Ultra-Light)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node Dependencies
        run: npm install

      - name: Build Tauri Desktop Application
        run: npx @tauri-apps/cli build

      - name: Prepare Release Artifacts
        shell: bash
        run: |
          mkdir -p release-binaries
          # Standalone lightweight portable executable (~3-5 MB)
          if [ -f src-tauri/target/release/neuroshift.exe ]; then
            cp src-tauri/target/release/neuroshift.exe release-binaries/NeuroShift-Portable-v1.0.0.exe
          fi
          # Bundled installers (NSIS or MSI)
          find src-tauri/target/release/bundle -type f -name "*.exe" -o -name "*.msi" 2>/dev/null | while read file; do
            cp "$file" release-binaries/
          done
          ls -la release-binaries/

      - name: Create or Update GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "NeuroShift Desktop v1.0.0 (Ultra-Light Windows ~3MB)"
          body: |
            🧠 **NEUROSHIFT — Clinical Console (Tauri v2 Ultra-Lightweight Edition)**
            
            - **NeuroShift-Portable-v1.0.0.exe**: Standalone single-file portable executable (~3-5 MB, zero installation).
            - Powered by Microsoft Edge WebView2 (no Chromium/Node bloatware).
            - Local-First, zero telemetry leakage, native Web Audio 40Hz Gamma generator & Huberman Respiratory Engine.
          files: release-binaries/*
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
