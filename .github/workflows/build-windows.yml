name: Build Windows Desktop App (Tauri v2 Ultra-Light)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node Dependencies
        run: npm install

      - name: Build Tauri Desktop Application
        run: npx @tauri-apps/cli build

      - name: Prepare Release Artifacts
        shell: bash
        run: |
          mkdir -p release-binaries
          # Standalone lightweight portable executable (~3-5 MB)
          if [ -f src-tauri/target/release/neuroshift.exe ]; then
            cp src-tauri/target/release/neuroshift.exe release-binaries/NeuroShift-Portable-v1.0.3.exe
          fi
          # Bundled installers (NSIS or MSI)
          find src-tauri/target/release/bundle -type f -name "*.exe" -o -name "*.msi" 2>/dev/null | while read file; do
            cp "$file" release-binaries/
          done
          ls -la release-binaries/

      - name: Create or Update GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "NeuroShift Desktop v1.0.3 (Pure Zero Baseline & Reactive Telemetry)"
          body: |
            🧠 **NEUROSHIFT — Clinical Console v1.0.3 (Tauri v2 Ultra-Lightweight Edition)**

            - **NeuroShift-Portable-v1.0.3.exe**: Standalone single-file portable executable (~8.5 MB, zero installation).
            - **100% Pure Day 0 Baseline**: Purged all pre-seeded mock incidents from the Black Box (empty white flight journal).
            - **Reactive Dynamic Circadian Map**: Replaced hardcoded risk bars with a dynamic engine that remains at a 0% safe baseline until the user logs real incidents.
            - **Neurobiological Mathematical Grounding**: Receptor status (D2 34%, PFC 38%) and NII explicitly labeled as theoretical Day 0 baseline estimates based on Volkow & Nestler literature.
            - **Tetris Craving Hijack Module**: 3-minute visuospatial craving interruptor with sound effects.
            - **Native Vazirmatn Typography**: 100% offline Persian font rendering without letter-spacing glitches.
          files: release-binaries/*
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
