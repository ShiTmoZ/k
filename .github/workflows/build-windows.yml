name: Build Windows Desktop App (NeuroShift)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows Executables
        run: npx electron-builder --win portable nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "NeuroShift Desktop v1.0.0 (Windows x64)"
          body: "🧠 Official NeuroShift Clinical Console (Windows Portable & NSIS Installer)."
          files: dist/*.exe
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Fallback)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: NeuroShift-Windows-Executables
          path: dist/*.exe
          if-no-files-found: warn
